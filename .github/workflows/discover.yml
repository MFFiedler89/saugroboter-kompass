name: Produkte finden (wöchentlich)
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Read-only product research'
        required: false
        default: ''
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
      AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Produktkandidaten prüfen
        run: node scripts/research-polster.mjs
