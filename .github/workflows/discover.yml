name: Produkte finden (wöchentlich)

on:
  schedule:
    # Montags 05:23 UTC: neue passende Produkte je Vergleichsseite suchen
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      args:
        description: 'Optional: Unterkategorie-Slug(s) und/oder --refresh'
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
      AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Datenordner sicherstellen
        run: mkdir -p src/data/asins
      - name: ASINs suchen
        env:
          ARGS: ${{ github.event.inputs.args }}
        run: npm run discover -- $ARGS
      - name: Änderungen speichern
        run: |
          git config user.name "saugradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/asins
          git diff --cached --quiet || git commit -m "Produkte aktualisiert (discover)"
          git push
