name: Veröffentlichen (Preise aktualisieren)

on:
  push:
    branches: [main]
  schedule:
    # Alle 6 Stunden: frische Preise/Daten von Amazon holen, neu bauen, veröffentlichen
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # Nach der wöchentlichen Produktsuche automatisch neu veröffentlichen
  workflow_run:
    workflows: ['Produkte finden (wöchentlich)']
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
      AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Produktdaten und Preise von Amazon holen
        run: npm run live
      - name: Seite bauen
        run: npm run build
      - name: Cloudflare-Pages-Projekt sicherstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages project create ${{ vars.CF_PAGES_PROJECT || 'saugradar' }} --production-branch=main || true
      - name: Auf Cloudflare Pages veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'saugradar' }} --branch=main
